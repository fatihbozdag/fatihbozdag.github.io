project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "tr/*.qmd"
  resources:
    - CNAME
    - robots.txt
    - files/**
    - pubs/**
    - stats/**

website:
  title: "Fatih Ünal Bozdağ"
  description: "Corpus linguistics, Cognitive Linguistics and NLP: usage-based accounts of grammar in learner English."
  site-url: https://fatihbozdag.com
  repo-url: https://github.com/fatihbozdag/fatihbozdag.github.io
  favicon: images/favicon.svg
  image: images/og-image.png
  image-alt: "Fatih Ünal Bozdağ, Assistant Professor of English Translation and Interpretation, Osmaniye Korkut Ata University"
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  navbar:
    background: light
    pinned: true
    left:
      - text: "About"
        href: index.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Tools & Data"
        href: tools.qmd
      - text: "Teaching"
        href: teaching.qmd
      - text: "Statistics"
        href: /stats/
      - text: "Türkçe"
        href: tr/index.qmd
    right:
      - text: "Profiles"
        icon: link-45deg
        menu:
          - text: "GitHub"
            icon: github
            href: https://github.com/fatihbozdag
          - text: "OSF"
            icon: archive
            href: https://osf.io/vz746/
          - text: "ORCID"
            icon: person-badge
            href: https://orcid.org/0000-0002-9959-4704
          - text: "Google Scholar"
            icon: mortarboard
            href: https://scholar.google.com/citations?user=W_xdrwwAAAAJ
          - text: "YÖK Akademik"
            icon: building
            href: https://akademik.yok.gov.tr/AkademikArama/
          - text: "---"
          - text: "Email"
            icon: envelope
            href: mailto:fatihbozdag@osmaniye.edu.tr
  page-footer:
    left: "© 2026 Fatih Ünal Bozdağ · Osmaniye Korkut Ata University"
    right:
      - text: "ORCID"
        href: https://orcid.org/0000-0002-9959-4704
      - text: "Google Scholar"
        href: https://scholar.google.com/citations?user=W_xdrwwAAAAJ
      - text: "GitHub"
        href: https://github.com/fatihbozdag
      - text: "OSF"
        href: https://osf.io/vz746/
      - text: "YÖK Akademik"
        href: https://akademik.yok.gov.tr/AkademikArama/

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [cosmo, styles-dark.scss, styles.scss]
    respect-user-color-scheme: true
    toc: false
    page-layout: article
    link-external-newwindow: true
    lang: en
    include-in-header:
      - text: |
          <meta name="author" content="Fatih Ünal Bozdağ">
    include-before-body:
      - text: |
          <a class="skip-link" href="#quarto-document-content">Skip to content</a>
